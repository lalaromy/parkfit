[project]
name = "parkfit"
version = "0.1.0"
description = "A multi-source data fusion engine for vehicle-specific parking suitability assessment (MSc project, Romy Abbrederis)"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.14.0",
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "typer==0.27.3",
  "rapidfuzz==3.14.6",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "sqlalchemy==2.1.4",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.4",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.0", "respx==0.23.1"]

[project.scripts]
parkfit = "parkfit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parkfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
